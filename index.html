<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Left Login Section -->
        <div class="login-box">

            <div class="logo">
                <img src="1319c6179efeb78b3e656e251b18cefd1805d915.png" alt="">
            </div>

            <h1>Log into your Account</h1>

            <form>
                <div class="input-box">
                    <label for="email">✉️</label>
                    <input type="email" id="email"
                        placeholder="Email address" required>
                </div>

                <div class="input-box">
                    <label for="password">♙</label>
                    <input type="password" id="password"
                        placeholder="Password" required>
                </div>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="signin">
                    Sign in
                </button>
            </form>

            <div class="or">
                <span></span>
                <p>OR</p>
                <span></span>
            </div>

            <button class="social google">🌐
                Sign in with Google
            </button>

            <button class="social facebook">f
                Sign in with Facebook
            </button>

            <button class="social apple">●
                Sign in with Apple
            </button>

            <p class="create">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </div>

        <!-- Right Image Section -->
        <div class="image-box">
            <img src="1.jpg" alt="" height="100%%"
            width="100%">
        </div>

    </div>

</body>
</html>
